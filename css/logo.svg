<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="50" height="50">
  <!-- Outer circle gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- G Letter -->
  <g transform="translate(30, 50)">
    <path d="M 20 5 Q 35 5 35 20 L 35 35 Q 35 45 20 45 Q 10 45 5 35 L 15 30 Q 18 38 20 38 Q 28 38 28 35 L 28 28 L 18 28 L 18 22 L 28 22 L 28 20 Q 28 10 20 10 Q 12 10 10 18 L 2 15 Q 5 5 20 5" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
  </g>
  
  <!-- F Letter -->
  <g transform="translate(70, 50)">
    <rect x="5" y="5" width="7" height="40" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
    <rect x="5" y="5" width="20" height="7" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
    <rect x="5" y="22" width="18" height="6" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
  </g>
  
  <!-- T Letter -->
  <g transform="translate(115, 50)">
    <rect x="5" y="5" width="20" height="7" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
    <rect x="12" y="12" width="7" height="33" fill="white" stroke="url(#logoGradient)" stroke-width="1"/>
  </g>
  
  <!-- Decorative bird wing accent -->
  <g transform="translate(140, 30)">
    <path d="M 5 15 Q 15 5 25 10 Q 20 15 15 12 Q 12 18 10 25" fill="none" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 8 20 Q 18 12 28 18 Q 23 22 18 20 Q 15 28 12 35" fill="none" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>